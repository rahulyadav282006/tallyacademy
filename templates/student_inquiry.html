<!DOCTYPE html>
<html lang="en">
<head>
  <title>Enquiry</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
  }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      padding: 30px;
      margin-top: 20px;
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
      font-size: 2.2rem;
      font-weight: 600;
    }

    h3 {
      color: #34495e;
      margin: 20px 0 10px 0;
      font-size: 1.3rem;
    }

    h3 i {
      color: #3498db;
      font-style: normal;
    }

    .input-group {
      display: flex;
      margin-bottom: 20px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .input-group-text {
      background: #3498db;
      color: white;
      padding: 12px 20px;
      border: none;
      font-weight: 600;
      min-width: 100px;
      text-align: center;
    }

    .form-control {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #ecf0f1;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-text {
      font-size: 0.85rem;
      color: #7f8c8d;
      margin-top: 5px;
    }

    .text-danger {
      color: #e74c3c;
      font-size: 0.9rem;
      margin-top: 5px;
      font-weight: 500;
    }

    .form-floating {
      margin-bottom: 25px;
    }

    .form-select {
      padding: 12px 15px;
      border: 2px solid #ecf0f1;
      border-radius: 8px;
      font-size: 1rem;
      background: white;
      transition: all 0.3s ease;
    }

    .form-select:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }

    textarea.form-control {
      min-height: 120px;
      resize: vertical;
      border: 2px solid #ecf0f1;
      border-radius: 8px;
      padding: 15px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    textarea.form-control:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 15px;
    }

    .btn-primary {
      background: #3498db;
      color: white;
    }

    .btn-primary:hover {
      background: #2980b9;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
    }

    .btn:last-child {
      background: #e74c3c;
      color: white;
    }

    .btn:last-child:hover {
      background: #c0392b;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
    }

    /* Custom styles for specific elements */
    #phone {
      border-radius: 8px;
      padding: 12px 15px;
      border: 2px solid #ecf0f1;
      width: 100%;
      font-size: 1rem;
    }

    #date1 {
      border-radius: 8px;
      padding: 12px 15px;
      border: 2px solid #ecf0f1;
      width: 100%;
      font-size: 1rem;
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .container {
        padding: 20px;
        margin: 10px;
      }
      
      h2 {
        font-size: 1.8rem;
      }
      
      h3 {
        font-size: 1.1rem;
      }
      
      .input-group {
        flex-direction: column;
      }
      
      .input-group-text {
        border-radius: 8px 8px 0 0;
      }
      
      .form-control {
        border-radius: 0 0 8px 8px;
      }
      
      .btn {
        width: 100%;
        margin-bottom: 10px;
        margin-right: 0;
      }
    }

    /* Animation for form elements */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-group, .form-floating, .input-group {
      animation: fadeIn 0.6s ease-out;
    }

    /* Success state for valid phone */
    .phone-valid {
      border-color: #27ae60 !important;
      background-color: rgba(39, 174, 96, 0.05);
    }

    /* Error state for invalid phone */
    .phone-invalid {
      border-color: #e74c3c !important;
      background-color: rgba(231, 76, 60, 0.05);
    }
  </style>
</head>
<body>

<div class="container mt-3">
  <h2 align="center">Enquiry form</h2>
  <form action="/action_page">
    <div class="mb-3 mt-3"><i><h3>Enter:-</h3></i>
      <div class="input-group mb-3">
        <span class="input-group-text">Student</span>
        <input type="text" class="form-control" placeholder="First Name">
        <input type="text" class="form-control" placeholder="Last Name">
      </div>
     <h3><i><label for="email">Email :-</label></i></h3>
        <div class="input-group">
        <input type="email" class="form-control" placeholder=" Enter Your Email">
        <span class="input-group-text">@example.com</span>
      </div>
   
    
    <div class="form-group">
      <h3><i><label for="phone">Phone Number :-</label><i></h3>
      <input type="tel" id="phone" name="phone" 
             class="form-control"
             pattern="[6-9][0-9]{9}"
             title="Please enter a valid 10-digit Indian mobile number"
             placeholder="Enter your phone number"
             maxlength="10"
             oninput="validatePhone(this)"
             required>
      <small class="form-text text-muted">
          Enter 10-digit mobile number starting with 6,7,8,9
      </small>
      <div id="phoneError" class="text-danger" style="display: none;"></div>
  </div><br>
    <div class="mb-3">
      <h3><i> <label for="date">Date of Birth :-</i></label></h3>
      <input type="date" class="form-control" id="date1" placeholder="Enter Date of Birth" name="date">
    </div>
    <div class="form-floating mb-3 mt-3">
      <h3><label for="sel1" class="form-label">Select course :-</label></h3>
      <select class="form-select form-select-lg" id="sel1" name="sellist">
        <option> Do Course selection</option>
        <option>Tally</option>
        <option>Python</option>
        <option>Excel</option>
        <option>Power BI</option>

      </select>
    </div> 
</div>
    <div class="form-floating mb-3 mt-3">
      <h3><i><label for="comment">Comments</label></i></h3>
      <textarea class="form-control" id="comment" name="text" placeholder="Comment goes here"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
    <button type="reset" class="btn btn-primary">Clear</button>
</div>
</form>
</div>

<script>
  function validatePhone(input) {
      const phoneError = document.getElementById('phoneError');
      const phonePattern = /^[6-9][0-9]{9}$/;
      
      if (input.value === '') {
          phoneError.style.display = 'none';
          return;
      }
      
      if (!phonePattern.test(input.value)) {
          phoneError.textContent = 'Please enter a valid 10-digit mobile number starting with 6,7,8,9';
          phoneError.style.display = 'block';
          input.style.borderColor = 'red';
      } else {
          phoneError.style.display = 'none';
          input.style.borderColor = 'green';
      }
  }
  </script>

 

</body>
</html>
